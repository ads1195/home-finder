<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9efff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0d1f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Sign in – Property Dashboard</title>
<style>
:root{--ink:#1d1f23;--mut:#6b7078;--glass:rgba(255,255,255,.7);--edge:rgba(255,255,255,.9);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#f3f4f6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(46% 38% at 10% 8%,rgba(255,255,255,.95),transparent 70%),radial-gradient(50% 45% at 92% 92%,rgba(205,210,220,.6),transparent 70%),linear-gradient(165deg,#fafafb,#eceef1)}
form{width:min(360px,90vw);padding:34px 28px 26px;border-radius:30px;background:var(--glass);border:1px solid var(--edge);
 -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
 box-shadow:0 18px 50px rgba(20,22,26,.09),0 1px 3px rgba(20,22,26,.05),inset 0 1px 0 #fff;animation:up .5s cubic-bezier(.22,1.1,.36,1) both}
@supports not (backdrop-filter:blur(1px)){form{background:#fff}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){form{animation:none}}
h1{font-size:1.3rem;font-weight:650;margin:0 0 4px;letter-spacing:-.02em} p{color:var(--mut);margin:0 0 22px;font-size:.92rem}
input,button{width:100%;font:inherit;font-size:1rem;padding:13px 18px;border-radius:99px;margin-bottom:12px;min-height:48px}
input{border:1px solid rgba(20,22,26,.1);background:rgba(255,255,255,.85);color:var(--ink);outline:none}
input:focus{border-color:#3563e9;box-shadow:0 0 0 3px rgba(53,99,233,.2)}
button{border:0;background:#1d1f23;color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(20,22,26,.2);transition:transform .3s cubic-bezier(.22,1.1,.36,1)}
button:active{transform:scale(.97)}
#e{color:#d4463f;min-height:1.2em;font-size:.9rem;text-align:center;margin:0}
</style></head><body>
<form id="f"><h1>Home finder</h1><p>Enter your password to continue.</p>
<input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
<button>Sign in</button><div id="e"></div></form>
<script>
f.onsubmit=async ev=>{ev.preventDefault();const r=await fetch('/login',{method:'POST',body:new FormData(f)});
if(r.ok)location.href='/';else e.textContent=r.status===429?'Too many attempts — try later':'Wrong password';};
</script></body></html>
