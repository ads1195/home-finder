<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9efff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0d1f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Sign in – Property Dashboard</title>
<style>
:root{--ink:#14181f;--mut:#5b6573;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--field:rgba(255,255,255,.6);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#f2f4f8;--mut:#a3adbb;--glass:rgba(34,38,58,.55);--edge:rgba(255,255,255,.22);--field:rgba(255,255,255,.08)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#e9efff;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(52% 42% at 12% 12%,rgba(120,119,255,.55),transparent 70%),radial-gradient(45% 45% at 92% 8%,rgba(255,126,190,.42),transparent 70%),radial-gradient(55% 50% at 80% 95%,rgba(54,214,200,.48),transparent 70%),radial-gradient(45% 45% at 6% 88%,rgba(255,196,102,.4),transparent 70%),linear-gradient(160deg,#e9efff,#f6eefc 55%,#e6f6f4)}
@media(prefers-color-scheme:dark){body{background:#0b0d1f}body::before{background:radial-gradient(52% 42% at 12% 12%,rgba(94,92,230,.55),transparent 70%),radial-gradient(45% 45% at 92% 8%,rgba(214,70,150,.34),transparent 70%),radial-gradient(55% 50% at 80% 95%,rgba(20,150,150,.42),transparent 70%),linear-gradient(160deg,#0b0d1f,#150f27 55%,#0a1a1e)}}
form{width:min(380px,90vw);padding:30px 26px;border-radius:34px;background:var(--glass);border:1px solid var(--edge);
 -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
 box-shadow:0 20px 50px rgba(40,50,110,.2),inset 0 1px 0 var(--edge);animation:up .6s cubic-bezier(.22,1.18,.36,1) both}
@supports not (backdrop-filter:blur(1px)){form{background:#f6f8ff}@media(prefers-color-scheme:dark){form{background:#1f2336}}}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){form{animation:none}}
.logo{font-size:2.2rem;line-height:1;margin-bottom:10px}
h1{font-size:1.35rem;margin:0 0 4px;letter-spacing:-.02em} p{color:var(--mut);margin:0 0 20px;font-size:.92rem}
input,button{width:100%;font:inherit;font-size:1rem;padding:14px 18px;border-radius:99px;margin-bottom:12px;min-height:50px}
input{border:1px solid var(--edge);background:var(--field);color:var(--ink);outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
input:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.3)}
button{border:1px solid rgba(255,255,255,.4);background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:650;cursor:pointer;box-shadow:0 8px 20px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .4s cubic-bezier(.22,1.18,.36,1)}
button:active{transform:scale(.96)}
#e{color:#e5484d;min-height:1.2em;font-size:.9rem;text-align:center}
</style></head><body>
<form id="f"><div class="logo">🏠</div><h1>Property Dashboard</h1><p>Enter the dashboard password.</p>
<input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
<button>Sign in</button><div id="e"></div></form>
<script>
f.onsubmit=async ev=>{ev.preventDefault();const r=await fetch('/login',{method:'POST',body:new FormData(f)});
if(r.ok)location.href='/';else e.textContent=r.status===429?'Too many attempts — try later':'Wrong password';};
</script></body></html>
