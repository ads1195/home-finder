<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Homes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vendor/leaflet.css?v=11">
<link rel="stylesheet" href="/static/style.css?v=11">
<title>Property Dashboard</title>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span>Home<br>finder</span></div>
    <nav id="sidenav"></nav>
    <div id="sidefoot"></div>
  </aside>
  <div id="main">
    <header id="top">
      <button id="backbtn" class="icon hide-wide" aria-label="Back" hidden>‹</button>
      <h1 id="title">Matches</h1>
      <div class="grow"></div>
      <span id="pollchip" class="chip" role="status"></span>
      <button id="refresh" class="icon" aria-label="Check for new listings now" title="Poll now">⟳</button>
    </header>
    <div id="offline" hidden>Offline – showing saved listings</div>
    <div id="panes">
      <section id="listpane"><div id="listview"></div></section>
      <section id="detailpane"><div id="detailview"><div class="empty">Select a listing</div></div></section>
      <section id="page"></section>
    </div>
  </div>
  <nav id="bottomnav"></nav>
</div>
<div id="lightbox" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script src="/static/vendor/leaflet.js?v=11"></script>
<script src="/static/favs.js?v=11"></script>
<script src="/static/app.js?v=11"></script>
</body>
</html>
