name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://home-finder-6l5q.onrender.com/healthz)
          echo "status: $code"
          test "$code" = "200"
